# Aeon v260926071154.0.0 (482c563482c014c2097e65f7ef528444e12ec7af) api/openapi.yaml sha256 4420f2d269af7477bcb41a7fa0d670f28376a151145c71ebb368c61ade370493
# Generated by scripts/check-aeon-stage-handoff-pins.py --write-excerpt; do not edit.
paths:
  /projects/{projectId}/journey:
    get:
      operationId: getProjectJourney
      summary: Read a project's derived journey
      description: ProjectId names a live project node. Stage and the single next action are derived from the current brief, decision, agreed requirements, release, handoff results and R2 decisions; clients cannot set them. project_node_id, project_key and tenant_slug are read from the project node and tenant row so a consumer can verify its configured binding. Query parameters and request bodies do not supply them.
      security: *auth
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Journey projection, content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}:
    get:
      operationId: getStageHandoff
      summary: Read a stage handoff
      description: >
        Allowed with stage_handoffs.read, or with the handoff's own operation
        scope (stage.prepare, stage.deploy, stage.verify or stage.apply) when
        the caller is the active agent principal whose name is the plugin the
        operation routes to (pharos for deploy and verify, janus for prepare
        and apply). Any other principal is refused, including one that holds
        the operation scope. prerequisite_seal_sha256 is the stored seal that
        a terminal result must echo.
      security: *auth
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Safe handoff projection, content: {application/json: {schema: {$ref: '#/components/schemas/StageHandoff'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/evidence:
    post:
      operationId: appendStageEvidence
      summary: Append typed stage evidence
      description: >
        The bound plugin appends monotonic typed evidence. Exact replay is
        idempotent; divergent replay and stale authority are conflicts. Janus
        evidence is value-free. Kind launch_readiness is Pharos observation on
        a deploy handoff. It requires reviewed_plan_digest (lowercase sha256),
        host, all_host_eval_passed, target_build_passed, backup_ready,
        backup_observed_at, restart_required, running_kernel and expected_kernel.
        Those fields are forbidden on every other kind. Admission treats the
        flags as authority and ignores the outcome word.
      security: [{agentKey: []}]
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageEvidenceWrite'}}}}
      responses:
        '201': {description: Evidence, content: {application/json: {schema: {$ref: '#/components/schemas/StageEvidence'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /stage-handoffs/{handoffId}/result:
    post:
      operationId: closeStageHandoff
      summary: Record a terminal stage result
      description: A terminal result requires current lineage, required prerequisite seal and typed evidence. Failed or stale results never advance the journey.
      security: [{agentKey: []}]
      parameters: [{name: handoffId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageResultWrite'}}}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/StageResult'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    agentKey: {type: http, scheme: bearer, description: Bearer token aeon_<prefix>_<secret>}
  schemas:
    Journey:
      type: object
      required: [project_node_id, project_key, tenant_slug, profile, revision, stage, stage_source, stages, next_action, requirements_revision, requirements_digest_sha256, requirements_approval_scope, launch_readiness]
      properties:
        project_node_id: {type: string, format: uuid, description: Project node id, read from the node. Not taken from the client.}
        project_key: {type: string, description: 'Route key used in /p/{project_key} links (e.g. PHAROS), read from the project node. Not a request field.'}
        node_key: {type: string, pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$', description: 'Immutable key of the project node (nodes.key, e.g. PRJ-17). Not a request field.'}
        tenant_slug: {type: string, minLength: 1, description: Slug of the tenant that owns the node. Not taken from the client.}
        profile: {type: string, enum: [personal, professional, enterprise]}
        revision: {type: integer, minimum: 1}
        stage: {type: string, enum: [inspire, shape, requirements, plan, build, deploy, access, live]}
        stage_source: {type: string, enum: [journey, derived], description: Whether stage selection uses recorded journey history or the imported-project data derivation}
        imported: {type: boolean, description: 'True for a project imported from classic Paimos with its history; its stages before Plan were never recorded here'}
        stages: {type: array, items: {$ref: '#/components/schemas/JourneyStage'}}
        next_action: {$ref: '#/components/schemas/JourneyNextAction'}
        requirements_revision: {type: integer, minimum: 0}
        requirements_digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        requirements_approval_scope: {type: string, description: Exact approval scope for the current requirements revision and content digest}
        launch_readiness: {$ref: '#/components/schemas/JourneyLaunchReadiness'}
        current_release_id: {type: [string, 'null'], format: uuid}
    JourneyLaunchReadiness:
      type: object
      required: [can_admit, reason]
      properties:
        can_admit: {type: boolean}
        reason: {type: string, description: Current blocker or empty when admission can proceed}
    JourneyStage:
      type: object
      required: [key, state]
      properties:
        key: {type: string, enum: [inspire, shape, requirements, plan, build, deploy, access, live]}
        state: {type: string, enum: [done, current, later, skipped, blocked]}
        gate_approval_id: {type: [string, 'null'], format: uuid}
        handoff_id: {type: [string, 'null'], format: uuid}
    JourneyNextAction:
      type: object
      required: [key, label, stage, available]
      properties:
        key: {type: string, enum: [continue_intake, confirm_brief, decide, reopen, approve_requirements, open_first_release, start_build, wait_for_build, mark_candidate, approve_candidate, approve_deploy, retry_deploy, approve_permit, plan_next_release]}
        label: {type: string}
        stage: {type: string, enum: [inspire, shape, requirements, plan, build, deploy, access, live]}
        available: {type: boolean}
        reason: {type: string}
        approval_request_id: {type: [string, 'null'], format: uuid}
    StageHandoff:
      type: object
      required: [id, project_node_id, release_node_id, stage, operation, plugin_id, attempt, authority_epoch, state, expires_at, evidence_ceiling, plan_digest, predecessor_digest, context_digest, prerequisite_seal_sha256]
      properties:
        id: {type: string, format: uuid}
        project_node_id: {type: string, format: uuid}
        release_node_id: {type: string, format: uuid}
        stage: {type: string, enum: [deploy, access]}
        operation: {type: string, enum: [prepare, apply, deploy, verify]}
        plugin_id: {type: string}
        attempt: {type: integer, minimum: 1}
        authority_epoch: {type: integer, minimum: 1}
        state: {type: string, enum: [requested, active, blocked, succeeded, failed, revoked]}
        expires_at: {type: string, format: date-time}
        evidence_ceiling: {type: array, items: {type: string, enum: [deployment, verification, authorization, credential_handoff, launch_readiness]}}
        plan_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        predecessor_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        context_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        prerequisite_seal_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Stored seal of the required predecessor set. It is the SHA-256 of
            the ordered dependency handoff id, evidence kind and terminal
            sequence joined by NUL, or the hash of an empty join when nothing
            is required. POST /stage-handoffs/{handoffId}/result must echo this
            exact value. A different seal is refused. Clients do not recompute
            it as authority.
        result: {$ref: '#/components/schemas/StageResult'}
    StageEvidenceWrite:
      type: object
      additionalProperties: false
      required: [sequence, kind, outcome, observed_at, authority_epoch]
      properties:
        sequence: {type: integer, minimum: 1}
        kind: {type: string, enum: [deployment, verification, authorization, credential_handoff, launch_readiness]}
        outcome: {type: string, enum: [succeeded, failed, satisfied, blocked]}
        observed_at: {type: string, format: date-time}
        authority_epoch: {type: integer, minimum: 1}
        workflow: {type: string, description: Pharos symbolic configured workflow}
        environment: {type: string, description: Pharos symbolic configured environment}
        artifact: {$ref: '#/components/schemas/StageArtifact'}
        authorized: {type: boolean, description: Janus fact only}
        credential_ready: {type: boolean, description: Janus fact only}
        reviewed_plan_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase sha256 hex. Required for launch_readiness and forbidden on other kinds.
        host:
          type: string
          minLength: 1
          maxLength: 256
          description: Required for launch_readiness and forbidden on other kinds.
        all_host_eval_passed: {type: boolean, description: Required for launch_readiness. A false value refuses admission.}
        target_build_passed: {type: boolean, description: Required for launch_readiness. A false value refuses admission.}
        backup_ready: {type: boolean, description: Required for launch_readiness. A false value refuses admission.}
        backup_observed_at: {type: string, format: date-time, description: Required for launch_readiness.}
        restart_required: {type: boolean, description: Required for launch_readiness. Stored, and not an admission input.}
        running_kernel: {type: string, minLength: 1, maxLength: 128, description: Required for launch_readiness.}
        expected_kernel: {type: string, minLength: 1, maxLength: 128, description: Required for launch_readiness.}
    StageEvidence:
      allOf:
        - {$ref: '#/components/schemas/StageEvidenceWrite'}
        - {type: object, required: [handoff_id, received_at], properties: {handoff_id: {type: string, format: uuid}, received_at: {type: string, format: date-time}}}
    StageArtifact:
      type: object
      additionalProperties: false
      required: [version_scheme, version, release_channel, release_sequence, digest_sha256, commit_digest, manifest_coordinate, manifest_digest_sha256]
      properties:
        version_scheme: {type: string, enum: [legacy, inspr-calendar-v1, inspr-calendar-v2]}
        version: {type: string}
        release_channel: {type: string}
        release_sequence: {type: integer, minimum: 1}
        digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        commit_digest: {type: string}
        manifest_coordinate: {type: string}
        manifest_digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    StageResultWrite:
      type: object
      additionalProperties: false
      required: [outcome, terminal_sequence, authority_epoch, prerequisite_seal_sha256]
      properties:
        outcome: {type: string, enum: [succeeded, failed]}
        terminal_sequence: {type: integer, minimum: 1}
        authority_epoch: {type: integer, minimum: 1}
        prerequisite_seal_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        blocker_code: {type: string, enum: [dependency_pending, dependency_failed, reporter_stale, external_waiting, policy_refused]}
    StageResult:
      allOf:
        - {$ref: '#/components/schemas/StageResultWrite'}
        - {type: object, required: [handoff_id, completed_at], properties: {handoff_id: {type: string, format: uuid}, completed_at: {type: string, format: date-time}}}
