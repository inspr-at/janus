[package]
name = "janus-distribute"
description = "Value-free host-envelope distribution seam for Janus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = "2"
janus-host = { path = "../janus-host" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
age = { version = "=0.12.1", default-features = false, features = ["ssh"] }
base64 = "0.21"
janus-core = { path = "../janus-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
ssh-key = { version = "=0.6.7", default-features = false, features = ["ed25519", "getrandom", "std"] }
tempfile = "3"
zeroize = "1"
