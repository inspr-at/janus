name: rust
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'devenv.nix'
      - 'flake.nix'
      - 'flake.lock'
      - 'examples/**'
      - 'config/assurance/**'
      - 'config/release-channels/**'
      - 'config/migrations/**'
      - 'fixtures/release-admission/**'
      - 'fixtures/migrations/**'
      - 'scripts/**'
      - 'Dockerfile.engine'
      - 'Dockerfile.engine.dockerignore'
      - '.github/workflows/rust.yml'
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JANUS-438: classify the PR's changed paths so a proven Go-only change
  # (UI/docs/browser-QA) can skip the expensive Rust engine assurance and
  # Nix jobs below, without those required check names ever going missing.
  # Push and release events never classify as go-only (the job simply does
  # not run for them); every downstream job below fails open to running its
  # real work whenever classify did not report a definitive go_only=true.
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      go_only: ${{ steps.classify.outputs.go_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify-pr-paths.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --github-output "${GITHUB_OUTPUT}"

  check-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: verify protected-main release ancestry
        if: github.event_name == 'release'
        env:
          JANUS_RELEASE_REPOSITORY: ${{ github.repository }}
          JANUS_RELEASE_TAG: ${{ github.event.release.tag_name }}
          JANUS_RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/check-release-main-ancestry.py --fetch-main --repository "${JANUS_RELEASE_REPOSITORY}" --tag "${JANUS_RELEASE_TAG}" --commit "${JANUS_RELEASE_COMMIT}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: install pinned security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: verify installed dependency scanner versions
        run: GITLEAKS_BIN="$(go env GOPATH)/bin/gitleaks" python3 scripts/check-security-gates.py --check-installed-tools --tool cargo-audit --tool gitleaks
      - name: release security policy and negative fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-release-docs.py
          python3 scripts/check-security-gates.py --self-test
          python3 scripts/check-release-mode-receipts.py --self-test
          python3 scripts/check-native-release-set.py --self-test
          python3 scripts/report-rust-release-timing.py --self-test
          python3 scripts/classify-pr-paths.py --self-test
          bash scripts/assure-engine-release.sh --self-test
          python3 scripts/check-engine-assurance-inventory.py --self-test
          python3 scripts/check-engine-assurance-inventory.py
          python3 scripts/report-pr-critical-path.py --self-test
          scripts/check-source-release.py --self-test --verify-grandfathered
          python3 scripts/check-release-main-ancestry.py --self-test
          scripts/check-rust-audit.py --self-test
          GITLEAKS_BIN="$(go env GOPATH)/bin/gitleaks" scripts/test-gitleaks.sh
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: build
        run: cargo build --all-targets --locked

  check-nix:
    needs: classify
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
      - name: nix package
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
        run: nix build .#janus-engine
      - name: nix package not applicable (go-only change)
        if: needs.classify.result == 'success' && needs.classify.outputs.go_only == 'true'
        run: echo "nix_package=not_applicable reason=go_only_change value_returned=false"

  # JANUS-438: the 9m17s serial engine assurance gate is split into two
  # independent proof-family jobs. `tests` runs checks and cargo tests plus
  # one cache-backed minimization image proof; `smoke` builds the daemon
  # binaries once and runs the with-runtime-authority smoke scripts. Both
  # groups, and the exact command each phase runs, are the reviewed table
  # in scripts/assure-engine-release.sh (see --list-phases), checked
  # against config/assurance/engine-release-phases-v1.json by
  # scripts/check-engine-assurance-inventory.py so a future edit cannot
  # silently drop or regroup a gate. The check-assurance fan-in job below
  # keeps the original required check name.
  check-assurance-tests:
    needs: classify
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
        with:
          go-version: '1.26.6'
          cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
      - name: build cache-backed minimization candidate
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.engine
          platforms: linux/amd64
          load: true
          tags: janus-engine:minimization
          cache-from: type=gha,scope=rust-engine-linux-amd64
      - name: engine release assurance gate (tests)
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
        env:
          JANUS_ENGINE_SMOKE_IMAGE: janus-engine:minimization
          JANUS_ENGINE_SMOKE_SKIP_BUILD: 'true'
        run: scripts/assure-engine-release.sh --phase tests
      - name: engine release assurance gate (tests) not applicable (go-only change)
        if: needs.classify.result == 'success' && needs.classify.outputs.go_only == 'true'
        run: echo "engine_assurance_tests=not_applicable reason=go_only_change value_returned=false"
      - name: preserve value-free property replay receipt
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rust-property-replay
          path: .tmp/janus-property-replay.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  check-assurance-smoke:
    needs: classify
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
        with:
          go-version: '1.26.6'
          cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
      - name: install smoke dependencies
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y age
      - name: engine release assurance gate (smoke)
        if: needs.classify.result != 'success' || needs.classify.outputs.go_only != 'true'
        run: scripts/assure-engine-release.sh --phase smoke
      - name: engine release assurance gate (smoke) not applicable (go-only change)
        if: needs.classify.result == 'success' && needs.classify.outputs.go_only == 'true'
        run: echo "engine_assurance_smoke=not_applicable reason=go_only_change value_returned=false"

  check-assurance:
    if: always()
    needs: [check-assurance-tests, check-assurance-smoke]
    runs-on: ubuntu-24.04
    env:
      TESTS: ${{ needs.check-assurance-tests.result }}
      SMOKE: ${{ needs.check-assurance-smoke.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: require both engine assurance proof families
        run: |
          test "${TESTS}" = success
          test "${SMOKE}" = success
      - name: verify engine assurance phase inventory
        run: python3 scripts/check-engine-assurance-inventory.py

  image-amd64:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'rust-engine-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.release-build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/janus-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: verify protected-main release ancestry
        if: github.event_name == 'release'
        env:
          JANUS_RELEASE_REPOSITORY: ${{ github.repository }}
          JANUS_RELEASE_TAG: ${{ github.event.release.tag_name }}
          JANUS_RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/check-release-main-ancestry.py --fetch-main --repository "${JANUS_RELEASE_REPOSITORY}" --tag "${JANUS_RELEASE_TAG}" --commit "${JANUS_RELEASE_COMMIT}"
      - name: verify release tag matches workspace version
        if: github.event_name == 'release'
        run: scripts/check-engine-release-tag.sh "${{ github.event.release.tag_name }}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build native amd64 candidate
        if: github.event_name != 'release'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.engine
          platforms: linux/amd64
          load: true
          tags: janus-engine:native-amd64
          cache-from: type=gha,scope=rust-engine-linux-amd64
          cache-to: type=gha,scope=rust-engine-linux-amd64,mode=max
      - name: build native amd64 image
        id: release-build
        if: github.event_name == 'release'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.engine
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=rust-engine-linux-amd64
          cache-to: type=gha,scope=rust-engine-linux-amd64,mode=max
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: github.event_name != 'release'
        with:
          version: v0.72.0
      - name: verify installed native scanner version
        if: github.event_name != 'release'
        run: python3 scripts/check-security-gates.py --check-installed-tools --tool trivy
      - name: smoke native amd64 candidate
        if: github.event_name != 'release'
        env:
          JANUS_ENGINE_SMOKE_IMAGE: janus-engine:native-amd64
          JANUS_ENGINE_SMOKE_SKIP_BUILD: 'true'
        run: scripts/smoke-engine-container.sh
      - name: scan native amd64 candidate
        if: github.event_name != 'release'
        run: |
          trivy image --scanners vuln --format json --output rust-trivy-amd64.json janus-engine:native-amd64
          python3 scripts/check-security-gates.py --trivy-report rust-trivy-amd64.json --summary rust-trivy-summary-amd64.json --subject janus-engine:native-amd64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name != 'release' && always()
        with:
          name: rust-candidate-security-summary-amd64
          path: rust-trivy-summary-amd64.json
          if-no-files-found: error

  image-arm64:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'rust-engine-v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.release-build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/janus-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: verify native arm64 runner
        run: test "$(uname -m)" = "aarch64"
      - name: verify protected-main release ancestry
        if: github.event_name == 'release'
        env:
          JANUS_RELEASE_REPOSITORY: ${{ github.repository }}
          JANUS_RELEASE_TAG: ${{ github.event.release.tag_name }}
          JANUS_RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/check-release-main-ancestry.py --fetch-main --repository "${JANUS_RELEASE_REPOSITORY}" --tag "${JANUS_RELEASE_TAG}" --commit "${JANUS_RELEASE_COMMIT}"
      - name: verify release tag matches workspace version
        if: github.event_name == 'release'
        run: scripts/check-engine-release-tag.sh "${{ github.event.release.tag_name }}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build native arm64 candidate
        if: github.event_name != 'release'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.engine
          platforms: linux/arm64
          load: true
          tags: janus-engine:native-arm64
          cache-from: type=gha,scope=rust-engine-linux-arm64
          cache-to: type=gha,scope=rust-engine-linux-arm64,mode=max
      - name: build native arm64 image
        id: release-build
        if: github.event_name == 'release'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.engine
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=rust-engine-linux-arm64
          cache-to: type=gha,scope=rust-engine-linux-arm64,mode=max
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: github.event_name != 'release'
        with:
          version: v0.72.0
      - name: verify installed native scanner version
        if: github.event_name != 'release'
        run: python3 scripts/check-security-gates.py --check-installed-tools --tool trivy
      - name: smoke native arm64 candidate
        if: github.event_name != 'release'
        env:
          JANUS_ENGINE_SMOKE_IMAGE: janus-engine:native-arm64
          JANUS_ENGINE_SMOKE_SKIP_BUILD: 'true'
        run: scripts/smoke-engine-container.sh
      - name: scan native arm64 candidate
        if: github.event_name != 'release'
        run: |
          trivy image --scanners vuln --format json --output rust-trivy-arm64.json janus-engine:native-arm64
          python3 scripts/check-security-gates.py --trivy-report rust-trivy-arm64.json --summary rust-trivy-summary-arm64.json --subject janus-engine:native-arm64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name != 'release' && always()
        with:
          name: rust-candidate-security-summary-arm64
          path: rust-trivy-summary-arm64.json
          if-no-files-found: error

  check:
    if: always()
    needs: [check-fast, check-nix, check-assurance, image-amd64, image-arm64]
    runs-on: ubuntu-24.04
    env:
      FAST: ${{ needs.check-fast.result }}
      NIX: ${{ needs.check-nix.result }}
      ASSURANCE: ${{ needs.check-assurance.result }}
      AMD64: ${{ needs.image-amd64.result }}
      ARM64: ${{ needs.image-arm64.result }}
      EVENT: ${{ github.event_name }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: require every Rust assurance boundary
        run: |
          test "${FAST}" = success
          test "${NIX}" = success
          test "${ASSURANCE}" = success
          if test "${EVENT}" = release && [[ "${TAG}" != rust-engine-v* ]]; then
            test "${AMD64}" = skipped
            test "${ARM64}" = skipped
          else
            test "${AMD64}" = success
            test "${ARM64}" = success
          fi

  # JANUS-438 acceptance criteria 4 and 7: a value-free critical-path timing
  # summary for the PR-path pipeline itself. Informational only (the step
  # never fails the job) while real evidence accumulates across PRs; a
  # numeric budget only applies once the change is classified go-only, so
  # it never fabricates a target for the full-assurance path.
  pr-path-timing:
    if: github.event_name == 'pull_request'
    needs: [classify, check]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: measure PR-path critical path
        env:
          GH_TOKEN: ${{ github.token }}
          GO_ONLY: ${{ needs.classify.outputs.go_only }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > rust-pr-run.json
          check_conclusion=""
          for attempt in {1..6}; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              | jq '{jobs: [.jobs[] | select(.name != "pr-path-timing")]}' > rust-pr-jobs.json
            check_conclusion="$(jq -r '.jobs[] | select(.name == "check") | .conclusion' rust-pr-jobs.json)"
            [[ "${check_conclusion}" = success ]] && break
            sleep 5
          done
          test "${check_conclusion}" = success
          budget_args=()
          if [[ "${GO_ONLY}" == "true" ]]; then
            budget_args=(--budget-seconds 300)
          fi
          python3 scripts/report-pr-critical-path.py --run rust-pr-run.json --jobs rust-pr-jobs.json "${budget_args[@]}" --output rust-pr-timing.json --summary rust-pr-timing.md || true
          cat rust-pr-timing.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: rust-pr-path-timing
          path: rust-pr-timing.json
          if-no-files-found: ignore

  image:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'rust-engine-v')
    needs: [check, image-amd64, image-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/janus-engine
      AMD64_DIGEST: ${{ needs.image-amd64.outputs.digest }}
      ARM64_DIGEST: ${{ needs.image-arm64.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: verify protected-main release ancestry
        env:
          JANUS_RELEASE_REPOSITORY: ${{ github.repository }}
          JANUS_RELEASE_TAG: ${{ github.event.release.tag_name }}
          JANUS_RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/check-release-main-ancestry.py --fetch-main --repository "${JANUS_RELEASE_REPOSITORY}" --tag "${JANUS_RELEASE_TAG}" --commit "${JANUS_RELEASE_COMMIT}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha
      - name: validate native digests and assemble manifest
        id: manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python3 scripts/check-native-release-set.py --amd64-digest "${AMD64_DIGEST}" --arm64-digest "${ARM64_DIGEST}" --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --output rust-release-platforms.json
          tag_args=()
          while IFS= read -r tag; do tag_args+=(--tag "${tag}"); done <<< "${TAGS}"
          docker buildx imagetools create "${tag_args[@]}" "${IMAGE}@${AMD64_DIGEST}" "${IMAGE}@${ARM64_DIGEST}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${{ github.event.release.tag_name }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "${digest#sha256:}" != "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          python3 scripts/check-native-release-set.py --amd64-digest "${AMD64_DIGEST}" --arm64-digest "${ARM64_DIGEST}" --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --output rust-release-platforms.json --verify-image "${IMAGE}@${digest}"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
      - name: verify installed release scanner version
        run: python3 scripts/check-security-gates.py --check-installed-tools --tool trivy
      - name: scan exact published candidate digest
        run: |
          trivy image --scanners vuln --format json --output rust-trivy.json "${IMAGE}@${{ steps.manifest.outputs.digest }}"
          python3 scripts/check-security-gates.py --trivy-report rust-trivy.json --summary rust-trivy-summary.json --subject "${IMAGE}@${{ steps.manifest.outputs.digest }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign and verify released source binding
        run: |
          python3 scripts/create-source-release-manifest.py --repository "${{ github.repository }}" --tag "${{ github.event.release.tag_name }}" --commit "${{ github.sha }}" --workflow ".github/workflows/rust.yml" --image "${IMAGE}" --image-digest "${{ steps.manifest.outputs.digest }}" --output source-release.json
          cosign sign-blob --yes --bundle source-release.sigstore.json source-release.json
          scripts/check-source-release.py --manifest source-release.json --bundle source-release.sigstore.json
          cosign verify-blob --bundle source-release.sigstore.json --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/rust.yml@refs/tags/${{ github.event.release.tag_name }}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" source-release.json
      - name: cosign sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: rust-engine-sbom.spdx.json
      - name: upload SBOM release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" rust-engine-sbom.spdx.json source-release.json source-release.sigstore.json rust-trivy-summary.json rust-release-platforms.json --clobber
      - name: build provenance attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: SPDX SBOM attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: rust-engine-sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: verify published engine digest and mode receipts
        env:
          GH_TOKEN: ${{ github.token }}
          JANUS_PUBLISHED_ENGINE_IMAGE: ${{ env.IMAGE }}
          JANUS_PUBLISHED_ENGINE_TAG: ${{ github.event.release.tag_name }}
          JANUS_PUBLISHED_ENGINE_DIGEST: ${{ steps.manifest.outputs.digest }}
          JANUS_RELEASE_CHANNEL_POLICY: config/release-channels/v1.json
          JANUS_RELEASE_CHANNEL: stable
          JANUS_PRODUCT_MODE: production
          JANUS_PREVIOUS_PRODUCT_MODE: production
          JANUS_PUBLISHED_ENGINE_ADMISSION_RECEIPT: rust-engine-admission.json
          JANUS_PUBLISHED_ENGINE_SOURCE_MANIFEST: source-release.json
          JANUS_PUBLISHED_ENGINE_SOURCE_BUNDLE: source-release.sigstore.json
          JANUS_PUBLISHED_ENGINE_SCANNER_SUMMARY: rust-trivy-summary.json
        run: |
          scripts/smoke-published-engine.sh
          scripts/admit-engine-release.sh --policy "${JANUS_RELEASE_CHANNEL_POLICY}" --channel "${JANUS_RELEASE_CHANNEL}" --mode enterprise --previous-mode enterprise --image "${JANUS_PUBLISHED_ENGINE_IMAGE}" --tag "${JANUS_PUBLISHED_ENGINE_TAG}" --digest "${JANUS_PUBLISHED_ENGINE_DIGEST}" --source-manifest "${JANUS_PUBLISHED_ENGINE_SOURCE_MANIFEST}" --source-bundle "${JANUS_PUBLISHED_ENGINE_SOURCE_BUNDLE}" --scanner-summary "${JANUS_PUBLISHED_ENGINE_SCANNER_SUMMARY}" --output rust-engine-admission-enterprise.json
          python3 scripts/check-release-mode-receipts.py --production rust-engine-admission.json --enterprise rust-engine-admission-enterprise.json
      - name: upload mode-specific admission receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" rust-engine-admission.json rust-engine-admission-enterprise.json --clobber

  release-timing:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'rust-engine-v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: measure and enforce release latency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > rust-run.json
          image_conclusion=""
          for attempt in {1..6}; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > rust-jobs.json
            image_conclusion="$(jq -r '.jobs[] | select(.name == "image") | .conclusion' rust-jobs.json)"
            [[ "${image_conclusion}" = success ]] && break
            sleep 5
          done
          test "${image_conclusion}" = success
          timing_status=0
          python3 scripts/report-rust-release-timing.py --run rust-run.json --jobs rust-jobs.json --output rust-release-timing.json --summary rust-release-timing.md --budget-seconds 900 || timing_status=$?
          cat rust-release-timing.md >> "${GITHUB_STEP_SUMMARY}"
          gh release upload "${{ github.event.release.tag_name }}" rust-release-timing.json --clobber
          exit "${timing_status}"
