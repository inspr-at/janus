name: go-envelope
# Build/test the transitional Go envelope, and on a release tag produce a
# SIGNED image + SBOM + build provenance. This closes the long-standing irony
# that the envelope implements release_provenance/supply_chain_posture but had
# no release pipeline of its own (JANUS release-hygiene gap).
#
# No custom secrets required: ghcr push uses the built-in GITHUB_TOKEN, cosign
# signs keyless via OIDC, and provenance uses actions/attest-build-provenance.
on:
  push:
    branches: [main]
    paths: ['go-envelope/**', 'browser-qa/**', 'package.json', 'package-lock.json', 'config/assurance/**', 'config/release-channels/**', 'scripts/**', '.github/workflows/go-envelope.yml']
  # Always report the branch-required Go check on pull requests. Pushes retain
  # the focused path filter above.
  pull_request:
  # Release the envelope image by pushing a tag like `go-envelope-v1.144`.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-envelope
    outputs:
      playwright_cache_hit: ${{ steps.playwright-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: verify protected-main release ancestry
        if: github.event_name == 'release'
        working-directory: .
        env:
          JANUS_RELEASE_REPOSITORY: ${{ github.repository }}
          JANUS_RELEASE_TAG: ${{ github.event.release.tag_name }}
          JANUS_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/check-release-main-ancestry.py \
            --fetch-main \
            --repository "${JANUS_RELEASE_REPOSITORY}" \
            --tag "${JANUS_RELEASE_TAG}" \
            --commit "${JANUS_RELEASE_COMMIT}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go-envelope/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: install pinned source scanners
        working-directory: .
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: verify installed source scanner versions
        working-directory: .
        run: GITLEAKS_BIN="$(go env GOPATH)/bin/gitleaks" python3 scripts/check-security-gates.py --check-installed-tools --tool gitleaks --tool govulncheck --tool staticcheck
      - run: go build ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go vet ./...
      - run: go test ./...
      - name: managed-service Go assurance
        working-directory: .
        run: |
          python3 scripts/run-managed-service-ux-assurance.py --self-test
          python3 scripts/run-managed-service-ux-assurance.py --stack go
      - name: cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1.61.1
      - name: install managed-service browser assurance
        working-directory: .
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          npm ci --ignore-scripts
          if [[ "${CACHE_HIT}" == "true" ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: managed-service real-browser assurance
        working-directory: .
        run: python3 scripts/run-managed-service-ux-assurance.py --stack browser
      - name: cross-surface Go minimization proof
        run: python3 ../scripts/run-minimization-proof.py --stack go
      - name: Gitleaks history and negative fixture
        working-directory: .
        run: GITLEAKS_BIN="$(go env GOPATH)/bin/gitleaks" scripts/test-gitleaks.sh
      - name: scanner policy and negative fixtures
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-security-gates.py --self-test
          scripts/check-source-release.py --self-test --verify-grandfathered
          python3 scripts/check-release-main-ancestry.py --self-test
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
      - name: verify installed image scanner version
        working-directory: .
        run: python3 scripts/check-security-gates.py --check-installed-tools --tool trivy
      - name: build and scan local candidate image
        working-directory: .
        run: |
          docker build -t janus-envelope:security go-envelope
          trivy image --scanners vuln --format json --output go-trivy.json janus-envelope:security
          python3 scripts/check-security-gates.py --trivy-report go-trivy.json --summary go-trivy-summary.json --subject janus-envelope:security
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: go-candidate-security-summary
          path: go-trivy-summary.json
          if-no-files-found: error

  # JANUS-438 acceptance criteria 4 and 7: a value-free critical-path timing
  # summary for the Go PR pipeline against the reviewed Go-only PR budget
  # (warm under 5 minutes, cold under 8 minutes), selected by the Playwright
  # Chromium cache outcome. Informational only (the step never fails the
  # job) while real evidence accumulates across PRs.
  pr-path-timing:
    if: github.event_name == 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: measure PR-path critical path
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_CACHE_HIT: ${{ needs.build-test.outputs.playwright_cache_hit }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > go-pr-run.json
          build_conclusion=""
          for attempt in {1..6}; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              | jq '{jobs: [.jobs[] | select(.name != "pr-path-timing")]}' > go-pr-jobs.json
            build_conclusion="$(jq -r '.jobs[] | select(.name == "build-test") | .conclusion' go-pr-jobs.json)"
            [[ "${build_conclusion}" = success ]] && break
            sleep 5
          done
          test "${build_conclusion}" = success
          cache_hit="false"
          [[ "${PLAYWRIGHT_CACHE_HIT}" == "true" ]] && cache_hit="true"
          budget=480
          [[ "${cache_hit}" == "true" ]] && budget=300
          python3 scripts/report-pr-critical-path.py --run go-pr-run.json --jobs go-pr-jobs.json --cache-hit "playwright=${cache_hit}" --budget-seconds "${budget}" --output go-pr-timing.json --summary go-pr-timing.md || true
          cat go-pr-timing.md >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: go-pr-path-timing
          path: go-pr-timing.json
          if-no-files-found: ignore

  image:
    # Only on a published GitHub Release whose tag starts with go-envelope-v.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'go-envelope-v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach SBOM as a release asset
      packages: write      # push image to ghcr
      id-token: write      # cosign keyless (OIDC)
      attestations: write  # build provenance attestation
    env:
      IMAGE: ghcr.io/${{ github.repository }}/janus-envelope
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: verify protected-main release ancestry
        working-directory: .
        env:
          JANUS_RELEASE_REPOSITORY: ${{ github.repository }}
          JANUS_RELEASE_TAG: ${{ github.event.release.tag_name }}
          JANUS_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/check-release-main-ancestry.py \
            --fetch-main \
            --repository "${JANUS_RELEASE_REPOSITORY}" \
            --tag "${JANUS_RELEASE_TAG}" \
            --commit "${JANUS_RELEASE_COMMIT}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: go-envelope
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JANUS_BUILD_COMMIT=${{ github.sha }}
            JANUS_BUILD_TIME=${{ github.event.release.published_at }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
      - name: verify installed release scanner version
        working-directory: .
        run: python3 scripts/check-security-gates.py --check-installed-tools --tool trivy
      - name: scan exact published candidate digest
        working-directory: .
        run: |
          trivy image --scanners vuln --format json --output go-trivy.json "${IMAGE}@${{ steps.build.outputs.digest }}"
          python3 scripts/check-security-gates.py --trivy-report go-trivy.json --summary go-trivy-summary.json --subject "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign and verify released source binding
        working-directory: .
        run: |
          python3 scripts/create-source-release-manifest.py \
            --repository "${{ github.repository }}" \
            --tag "${{ github.event.release.tag_name }}" \
            --commit "${{ github.sha }}" \
            --workflow ".github/workflows/go-envelope.yml" \
            --image "${IMAGE}" \
            --image-digest "${{ steps.build.outputs.digest }}" \
            --output source-release.json
          cosign sign-blob --yes --bundle source-release.sigstore.json source-release.json
          scripts/check-source-release.py --manifest source-release.json --bundle source-release.sigstore.json
          cosign verify-blob \
            --bundle source-release.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/go-envelope.yml@refs/tags/${{ github.event.release.tag_name }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            source-release.json
      - name: cosign sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: upload SBOM release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            sbom.spdx.json \
            source-release.json \
            source-release.sigstore.json \
            go-trivy-summary.json \
            --clobber
      - name: build provenance attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SPDX SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: verify published envelope admission evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/admit-engine-release.sh \
            --policy config/release-channels/v1.json \
            --channel envelope-stable \
            --mode production \
            --previous-mode production \
            --image "${IMAGE}" \
            --tag "${{ github.event.release.tag_name }}" \
            --digest "${{ steps.build.outputs.digest }}" \
            --source-manifest source-release.json \
            --source-bundle source-release.sigstore.json \
            --scanner-summary go-trivy-summary.json \
            --output go-envelope-admission.json
      - name: upload envelope admission receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" go-envelope-admission.json --clobber
