name: release-tools-rehearsal
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: release-tools-rehearsal
  cancel-in-progress: false

jobs:
  rehearse-release-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: checkout rehearsal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: verify native architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "${EXPECTED_ARCHITECTURE}"
      - name: install Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: verify Buildx
        run: docker buildx inspect --bootstrap
      - name: authenticate read-only to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive release metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/release-rehearsal
          tags: type=raw,value=rehearsal
      - name: verify release metadata
        env:
          ACTUAL_TAGS: ${{ steps.metadata.outputs.tags }}
          ACTUAL_LABELS: ${{ steps.metadata.outputs.labels }}
          EXPECTED_TAG: ghcr.io/${{ github.repository }}/release-rehearsal:rehearsal
        run: |
          test "${ACTUAL_TAGS}" = "${EXPECTED_TAG}"
          test -n "${ACTUAL_LABELS}"
      - name: install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
      - name: verify installed release scanner version
        run: python3 scripts/check-security-gates.py --check-installed-tools --tool trivy
      - name: install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign and verify disposable local blob
        env:
          COSIGN_PASSWORD: not-a-secret-release-rehearsal
        run: |
          rehearsal_dir="${RUNNER_TEMP}/janus-release-rehearsal"
          install -d -m 0700 "${rehearsal_dir}"
          cd "${rehearsal_dir}"
          printf 'janus release rehearsal\n' > payload.txt
          cosign generate-key-pair
          cosign sign-blob --yes --key cosign.key \
            --bundle payload.sigstore.json payload.txt
          cosign verify-blob --key cosign.pub \
            --bundle payload.sigstore.json payload.txt
